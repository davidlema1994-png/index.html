<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Para Ti ❤️</title>

<!-- Fuente cursiva -->
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Dancing Script', cursive;
    background: linear-gradient(135deg, #f5f5f5, #e0e0e0);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* SOBRE */
#sobre {
    position: relative;
    width: 320px;
    height: 200px;
    background: #ff4d88;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 15px 30px rgba(0,0,0,0.3);
}

/* TAPA */
#tapa {
    position: absolute;
    width: 100%;
    height: 100%;
    background: #ff6699;
    clip-path: polygon(0 0, 50% 60%, 100% 0);
    transform-origin: top;
    transition: transform 1s;
    z-index: 3;
}

/* BASE */
#base {
    position: absolute;
    width: 100%;
    height: 100%;
    background: #e84375;
    clip-path: polygon(0 100%, 50% 40%, 100% 100%);
}

/* CARTA */
#carta {
    position: absolute;
    width: 350px;
    max-height: 450px;
    background: white;
    border-radius: 15px;
    padding: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    transform: translateY(100%);
    transition: transform 1s;
    overflow-y: auto;
    text-align: center;
}

/* SCROLL */
#carta::-webkit-scrollbar {
    width: 6px;
}
#carta::-webkit-scrollbar-thumb {
    background: #ff4d88;
    border-radius: 10px;
}

/* TEXTO */
h2 {
    color: #ff4d88;
    font-size: 28px;
}

p {
    font-size: 18px;
    color: #444;
    line-height: 1.6;
}

/* FOTOS */
.galeria img {
    width: 90px;
    margin: 8px;
    border-radius: 12px;
    border: 3px solid #ddd;
    box-shadow: 0 5px 10px rgba(0,0,0,0.2);
    transition: transform 0.3s;
}

.galeria img:hover {
    transform: scale(1.1);
}

/* BOTÓN */
button {
    padding: 8px 15px;
    background: #ff4d88;
    border: none;
    border-radius: 8px;
    color: white;
    cursor: pointer;
    margin-top: 10px;
}

/* EFECTOS */
.abierto #tapa {
    transform: rotateX(180deg);
}

.abierto #carta {
    transform: translateY(-250px);
}

/* CUANDO SE ABRE */
.oculto {
    display: none;
}

/* CENTRAR CARTA FINAL */
.cartaFinal {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
}
</style>

</head>

<body>

<div id="sobre" onclick="abrirSobre()">
    <div id="tapa"></div>
    <div id="base"></div>
</div>

<div id="carta">
    <h2>Para mi amor 💕</h2>

    <p>
Amor, quería escribirle una carta expresando lo que siento...<br><br>

Estar a su lado me hace creer mucho más en esos amores bonitos...<br><br>

Me encanta su forma de ser...<br><br>

Amo nuestros viajes...<br><br>

Amo su sonrisa...<br><br>

Gracias por ser quien es...<br><br>

<strong>¡Te Quiero! ❤️</strong>
    </p>

    <button onclick="reproducirMusica()">🎵 Música</button>

    <div class="galeria">
        <img src="foto1.JPEG">
        <img src="foto2.JPEG">
        <img src="foto3.JPEG">
    </div>
</div>

<audio id="musica" loop>
    <source src="musica.mp3" type="audio/mpeg">
</audio>

<script>
function abrirSobre(){
    let sobre = document.getElementById("sobre");
    let carta = document.getElementById("carta");

    sobre.classList.add("abierto");

    setTimeout(()=>{
        sobre.classList.add("oculto");
        carta.classList.add("cartaFinal");
        carta.style.transform = "translateY(-50%)";
    }, 1000);
}

function reproducirMusica(){
    document.getElementById("musica").play();
}
</script>

</body>
</html>
